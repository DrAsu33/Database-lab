[package]
name = "lab05"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
# 仅启用对 mysql、运行时 (tokio) 和宏的支持
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls", "macros", "chrono"] }
dotenvy = "0.15"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# === Web 前端依赖 ===
axum = "0.7"                                         # HTTP 框架
axum-extra = { version = "0.9", features = ["cookie"] } # Cookie 支持（登录态）
tera = "1"                                           # HTML 模板引擎
tower-http = { version = "0.5", features = ["fs"] }  # 静态文件服务
time = "0.3"                                         # Cookie 过期时间