{% extends "base.html" %}
{% block title %}个人资料 - 朋友圈{% endblock title %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white rounded-2xl shadow-md p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">👤 个人资料</h2>

        <form method="POST" action="/profile" class="space-y-5">
            <!-- ID (只读) -->
            <div>
                <label class="block text-sm font-medium text-gray-500 mb-1">用户 ID（不可修改）</label>
                <input type="text" value="{{ profile.id }}" disabled
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-lg bg-gray-50 text-gray-500 outline-none">
            </div>

            <!-- 昵称 -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">昵称</label>
                <input type="text" name="name" value="{{ profile.name | default(value='') }}" maxlength="20"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                    placeholder="设置你的昵称">
            </div>

            <!-- 性别 -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">性别</label>
                <select name="gender"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all bg-white">
                    <option value="">不设置</option>
                    <option value="M" {% if profile.gender == 'M' %}selected{% endif %}>男 (M)</option>
                    <option value="F" {% if profile.gender == 'F' %}selected{% endif %}>女 (F)</option>
                </select>
            </div>

            <!-- 出生日期 -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">出生日期</label>
                <input type="date" name="birth_date" value="{{ profile.birth_date | default(value='') }}"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all">
            </div>

            <!-- 计算年龄显示 -->
            {% if profile.age %}
            <div class="px-4 py-3 bg-blue-50 rounded-lg text-sm text-blue-700">
                🎂 当前年龄：<strong>{{ profile.age }} 岁</strong>
            </div>
            {% endif %}

            <button type="submit"
                class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors shadow-sm mt-2">
                💾 保存资料
            </button>
        </form>
    </div>
</div>
{% endblock content %}
