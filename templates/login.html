{% extends "base.html" %}
{% block title %}登录 / 注册 - 朋友圈{% endblock title %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
    <!-- 登录卡片 -->
    <div class="bg-white rounded-2xl shadow-md p-8 mb-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">🔐 登录</h2>
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">用户 ID</label>
                <input type="number" name="uid" required
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                    placeholder="请输入你的用户 ID">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">密码</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                    placeholder="请输入密码">
            </div>
            <button type="submit"
                class="w-full bg-primary text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition-colors shadow-sm">
                登 录
            </button>
        </form>
    </div>

    <!-- 注册卡片 -->
    <div class="bg-white rounded-2xl shadow-md p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">📝 注册新用户</h2>
        <form method="POST" action="/register" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">设置密码</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                    placeholder="请设置你的密码">
            </div>
            <button type="submit"
                class="w-full bg-emerald-500 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-600 transition-colors shadow-sm">
                注 册
            </button>
        </form>
        <p class="text-xs text-gray-400 mt-4 text-center">注册成功后系统会自动分配一个用户 ID，请妥善保管</p>
    </div>

    <!-- 管理员提示 -->
    <div class="mt-4 p-3 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-700">
        💡 <strong>管理员账号：</strong>ID 为 <code class="bg-amber-100 px-1 rounded">1</code>，密码为 <code class="bg-amber-100 px-1 rounded">adminpass</code>
    </div>
</div>
{% endblock content %}
